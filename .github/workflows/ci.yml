name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Vet, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.19.x'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -count=1 -race ./...

      - name: Build server
        run: go build -v -o bin/nebengbeli-server ./cmd/server

      - name: Build CLI
        run: go build -v -o bin/nebengbeli-cli ./cmd/cli

  frontend-checks:
    name: Frontend Test, Build & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Security audit (high/critical)
        run: npm audit --audit-level=high
