name: CI

on:
  push:
    branches: [ main, dev, 'task/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-checks:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go.sum

      - name: Go Vet
        run: cd backend && go vet ./...

      - name: Go Test
        run: cd backend && go test -v -race ./...

      - name: Build Backend Binaries
        run: |
          cd backend
          go build -v -o bin/nebengbeli-server ./cmd/server
          go build -v -o bin/nebengbeli-cli ./cmd/cli

  frontend-checks:
    name: Frontend Typecheck, Build & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Security Audit (High/Critical)
        run: cd frontend && npm audit --audit-level=high

      - name: Build Frontend
        run: cd frontend && npm run build
