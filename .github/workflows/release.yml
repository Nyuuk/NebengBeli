name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build, Publish Images & Dispatch Deploy
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve Commit SHA and Image Tags
        id: meta
        run: |
          FULL_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          TAG="sha-${FULL_SHA}"
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          BACKEND_IMAGE="ghcr.io/${REPO_OWNER}/nebengbeli/backend:${TAG}"
          FRONTEND_IMAGE="ghcr.io/${REPO_OWNER}/nebengbeli/frontend:${TAG}"
          
          echo "full_sha=${FULL_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "backend_image=${BACKEND_IMAGE}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_IMAGE}" >> $GITHUB_OUTPUT
          
          echo "Resolved Tag: ${TAG}"
          echo "Backend Image: ${BACKEND_IMAGE}"
          echo "Frontend Image: ${FRONTEND_IMAGE}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.frontend_image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Cross-Repository Dispatch Prerequisite:
      # This step uses GITHUB_TOKEN only as specified.
      # By default, GitHub Actions GITHUB_TOKEN is scoped to this repository (Nyuuk/NebengBeli).
      # If cross-repo dispatch to Nyuuk/kube-config is restricted by GitHub's security boundary
      # (e.g. 403 / Resource not accessible), ensure that:
      #   1. Repository Actions settings permit cross-repository access, OR
      #   2. A fine-grained PAT / GitHub App token with 'contents: write' scope on Nyuuk/kube-config
      #      is configured (e.g., secrets.DISPATCH_PAT) if cross-repo authorization fails.
      - name: Dispatch Deploy Event to Nyuuk/kube-config
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fullSha = '${{ steps.meta.outputs.full_sha }}';
            const tag = `sha-${fullSha}`;

            // Nested images payload matching Nyuuk/kube-config cd.yaml multi-file update contract
            const images = {
              "backend.yaml": {
                "backend": tag
              },
              "frontend.yaml": {
                "frontend": tag
              }
            };

            console.log(`Dispatching deployment to Nyuuk/kube-config (target_folder: apps/nebengbeli)...`);
            console.log(`Payload images:`, JSON.stringify(images, null, 2));

            await github.rest.repos.createDispatchEvent({
              owner: 'Nyuuk',
              repo: 'kube-config',
              event_type: 'deploy',
              client_payload: {
                images: JSON.stringify(images),
                target_folder: 'apps/nebengbeli'
              }
            });

            console.log('Successfully dispatched deploy event to Nyuuk/kube-config');
