name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - development
          - production
      release_tag:
        description: Existing version tag to publish (for example v0.1.0); leave empty for current ref
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    name: Build & Publish Images
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify requested release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::release_tag must be a version tag such as v0.1.0"
            exit 1
          fi
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout --detach "refs/tags/${RELEASE_TAG}"

      # Temporarily disabled while Vault is unavailable
      # - name: Fetch notification credentials from Vault
      #   uses: ./.github/actions/vault-secrets

      - name: Resolve Commit SHA and Image Tags
        id: meta
        env:
          VITE_API_URL_DEVELOPMENT: ${{ vars.VITE_API_URL_DEVELOPMENT }}
          VITE_API_URL_PRODUCTION: ${{ vars.VITE_API_URL_PRODUCTION }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          REPO_OWNER_INPUT: ${{ github.repository_owner }}
        run: |
          FULL_SHA="$(git rev-parse HEAD)"
          IMAGE_TAGS=("sha-${FULL_SHA}")
          RELEASE_TAG=""
          if [[ ( "$EVENT_NAME" == "push" || ( "$EVENT_NAME" == "workflow_dispatch" && -n "$RELEASE_TAG_INPUT" ) ) && "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            RELEASE_TAG="$REF_NAME"
            IMAGE_TAGS+=("${RELEASE_TAG}" latest)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$RELEASE_TAG_INPUT" ]]; then
            echo "::error::release_tag must be a version tag such as v0.1.0"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" || ( "$EVENT_NAME" == "workflow_dispatch" && "$RELEASE_ENVIRONMENT" == "production" ) ]]; then
            DEPLOY_ENVIRONMENT="production"
            TARGET_FOLDER="apps/nebengbeli/production"
            ROUTE_FILE="apps/http-route/nebengbeli-production.yaml"
            API_URL="$VITE_API_URL_PRODUCTION"
          else
            DEPLOY_ENVIRONMENT="development"
            TARGET_FOLDER="apps/nebengbeli"
            ROUTE_FILE="apps/http-route/nebengbeli.yaml"
            API_URL="$VITE_API_URL_DEVELOPMENT"
          fi
          if [[ -z "$API_URL" ]]; then
            echo "::error::VITE_API_URL is not configured for ${DEPLOY_ENVIRONMENT}"
            exit 1
          fi
          REPO_OWNER=$(echo "$REPO_OWNER_INPUT" | tr '[:upper:]' '[:lower:]')
          
          BACKEND_IMAGE="ghcr.io/${REPO_OWNER}/nebengbeli/backend"
          FRONTEND_IMAGE="ghcr.io/${REPO_OWNER}/nebengbeli/frontend"
          {
            echo "full_sha=${FULL_SHA}"
            echo "release_tag=${RELEASE_TAG}"
            echo "image_tags<<IMAGE_TAGS_EOF"
            printf '%s\n' "${IMAGE_TAGS[@]}"
            echo "IMAGE_TAGS_EOF"
            echo "backend_tags<<BACKEND_TAGS_EOF"
            printf '%s\n' "${IMAGE_TAGS[@]/#/${BACKEND_IMAGE}:}"
            echo "BACKEND_TAGS_EOF"
            echo "frontend_tags<<FRONTEND_TAGS_EOF"
            printf '%s\n' "${IMAGE_TAGS[@]/#/${FRONTEND_IMAGE}:}"
            echo "FRONTEND_TAGS_EOF"
            echo "backend_image=${BACKEND_IMAGE}:sha-${FULL_SHA}"
            echo "frontend_image=${FRONTEND_IMAGE}:sha-${FULL_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "target_folder=${TARGET_FOLDER}" >> $GITHUB_OUTPUT
          echo "route_file=${ROUTE_FILE}" >> $GITHUB_OUTPUT
          echo "deploy_environment=${DEPLOY_ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          
          echo "Resolved Image Tags: ${IMAGE_TAGS[*]}"
          echo "Backend Image: ${BACKEND_IMAGE}"
          echo "Frontend Image: ${FRONTEND_IMAGE}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_URL=${{ steps.meta.outputs.api_url }}

      # Deployment dispatch intentionally disabled for now; uncomment to resume kube-config deployments.
      # - name: Verify GitHub Token
      #   run: |
      #     if [ -z "${GITHUB_TOKEN:-}" ]; then
      #       echo "::error::GITHUB_TOKEN is unset or empty after fetching from Vault"
