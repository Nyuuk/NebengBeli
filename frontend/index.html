<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="description" content="NebengBeli - Solusi Pembukuan Titipan & Ledger Bersama Praktis" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    />
    <title>NebengBeli - Buku Titipan & Ledger Bersama</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        if (!('serviceWorker' in navigator)) {
          if (!window.isSecureContext) {
            console.warn('[PWA] Service Worker registration skipped: Origin is not a Secure Context. To enable PWA Service Worker, access the application via https://, http://localhost, or http://127.0.0.1.');
          } else {
            console.warn('[PWA] Service Worker is not supported in this browser environment.');
          }
          return;
        }

        const registerSW = () => {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] Service Worker registered successfully, scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        };

        if (document.readyState === 'complete') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      })();
    </script>
  </body>
</html>
